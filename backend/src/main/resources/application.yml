server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: civicfix-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:CivicFixSuperSecretKeyForJwtTokenGeneration2026SecureStringWith256Bits}
    expiration-ms: 86400000 # 24 hours
  admin:
    email: ${CIVICFIX_ADMIN_EMAIL:${ADMIN_EMAIL:subasri04006@gmail.com}}
    password: ${CIVICFIX_ADMIN_PASSWORD:${ADMIN_PASSWORD:}}
    username: ${CIVICFIX_ADMIN_USERNAME:${ADMIN_USERNAME:subasri04006@gmail.com}}
    full-name: ${ADMIN_NAME:Chief Administrator}
  upload:
    dir: ${UPLOAD_DIR:./uploads/complaints}
  priority:
    age-weight-per-day: 2.0
    max-age-weight: 30.0
  duplicate:
    window-days: 30
    threshold-percentage: 45.0

---
# Dev Profile: In-memory H2 with MySQL compatibility (runs seamlessly out-of-the-box)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:civicfix_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# MySQL Profile: Production / Local MySQL 8.0 Server
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:civicfix_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
